command:
  - python
  - app.py

env:
  - name: ENDPOINT_NAME
    value: "projects/dataexpert-support-app/branches/production/endpoints/primary"
  - name: EMBEDDING_MODEL_NAME
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: CHUNK_SIZE
    value: "800"
  - name: CHUNK_OVERLAP
    value: "100"
  - name: NWS_USER_AGENT
    value: "DataExpertWeatherVectorHomework/1.0 (github.com/PedroD1265/dataexpert-weather-vector-retrieval)"
  - name: HF_HOME
    value: "/tmp/huggingface"
  - name: SENTENCE_TRANSFORMERS_HOME
    value: "/tmp/huggingface"
